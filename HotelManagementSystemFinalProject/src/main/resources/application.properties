spring.application.name=HotelManagementSystemFinalProject
spring.datasource.url=${HOTEL_DATABASE_URL:jdbc:h2:file:./data/hotel_db}
spring.datasource.username=${HOTEL_DATABASE_USERNAME:sa}
spring.datasource.password=${HOTEL_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.sql.init.mode=never
hotel.admin-password=${HOTEL_ADMIN_PASSWORD}
hotel.staff-password=${HOTEL_STAFF_PASSWORD}
