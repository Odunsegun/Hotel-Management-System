<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Bookings</title>
</head>
<body>
<section>
    <div class="page-header">
        <h1>Booking Management</h1>
        <p>Create reservations, manage stays, and generate invoices.</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>All Bookings</h2>
        </div>
        <table class="data-table" th:if="${!bookings.isEmpty()}">
            <thead>
            <tr>
                <th>Guest</th>
                <th>Room</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Nights</th>
                <th>Status</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td th:text="${b.customer.name}">Guest</td>
                <td th:text="${b.room.roomNumber + ' - ' + b.room.type}">Room</td>
                <td th:text="${b.startDate}">Start</td>
                <td th:text="${b.endDate}">End</td>
                <td th:text="${b.nights}">0</td>
                <td>
                    <span class="badge" th:classappend="${b.status.name() == 'CONFIRMED'} ? ' badge-success' : ' badge-muted'"
                          th:text="${b.status}">Status</span>
                </td>
                <td th:text="${'$' + #numbers.formatDecimal(b.grandTotal, 1, 2)}">$0.00</td>
                <td class="actions">
                    <a th:href="@{/bookings/{id}/invoice(id=${b.id})}" class="btn btn-sm">Invoice</a>
                    <a th:href="@{/bookings/edit/{id}(id=${b.id})}" class="btn btn-sm">Edit</a>
                    <form th:if="${b.status.name() == 'CONFIRMED'}" th:action="@{/bookings/cancel/{id}(id=${b.id})}" method="post" class="inline-form">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Cancel this booking?')">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="empty-state" th:if="${bookings.isEmpty()}">No bookings yet. Create one below.</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 th:text="${booking.id != null} ? 'Edit Booking' : 'New Booking'">New Booking</h2>
        </div>
        <form th:action="@{/bookings/save}" th:object="${booking}" method="post" class="form form-wide">
            <input type="hidden" th:field="*{id}">

            <div class="form-row">
                <div class="form-group">
                    <label for="customerId">Customer</label>
                    <select id="customerId" name="customer.id" required>
                        <option value="">Select customer</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.name + ' (' + c.email + ')'}"
                                th:selected="${booking.customer != null and booking.customer.id == c.id}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="roomId">Room</label>
                    <select id="roomId" name="room.id" required>
                        <option value="">Select room</option>
                        <option th:each="r : ${rooms}"
                                th:value="${r.id}"
                                th:text="${r.roomNumber + ' - ' + r.type + ' ($' + #numbers.formatDecimal(r.price, 1, 2) + '/night)'}"
                                th:selected="${booking.room != null and booking.room.id == r.id}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Check-in Date</label>
                    <input type="date" id="startDate" th:field="*{startDate}" required>
                </div>
                <div class="form-group">
                    <label for="endDate">Check-out Date</label>
                    <input type="date" id="endDate" th:field="*{endDate}" required>
                </div>
            </div>

            <div class="form-group" th:if="${!allServices.isEmpty()}">
                <label>Additional Services</label>
                <div class="checkbox-group">
                    <label th:each="s : ${allServices}" class="checkbox-label">
                        <input type="checkbox" name="serviceIds" th:value="${s.id}"
                               th:checked="${selectedServiceIds.contains(s.id)}">
                        <span th:text="${s.name + ' - $' + #numbers.formatDecimal(s.price, 1, 2)}">Service</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Booking</button>
            <a th:href="@{/bookings}" class="btn btn-outline" th:if="${booking.id != null}">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
