<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Services</title>
</head>
<body>
<section>
    <div class="page-header">
        <h1>Services Catalog</h1>
        <p>Manage hotel amenities and add-on services for bookings.</p>
    </div>

    <div class="two-column">
        <div class="card">
            <div class="card-header">
                <h2>All Services</h2>
            </div>
            <table class="data-table" th:if="${!services.isEmpty()}">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${services}">
                    <td th:text="${s.name}">Breakfast</td>
                    <td th:text="${s.description}">Description</td>
                    <td th:text="${'$' + #numbers.formatDecimal(s.price, 1, 2)}">$0.00</td>
                    <td class="actions" sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/services/edit/{id}(id=${s.id})}" class="btn btn-sm">Edit</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/services/delete/{id}(id=${s.id})}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this service?')">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="empty-state" th:if="${services.isEmpty()}">No services yet. Add one using the form.</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 th:text="${providedService.id != null} ? 'Edit Service' : 'Add Service'">Add Service</h2>
            </div>
            <form sec:authorize="hasRole('ADMIN')" th:action="@{/services/save}" th:object="${providedService}" method="post" class="form">
                <input type="hidden" th:field="*{id}">
                <label for="name">Service Name</label>
                <input type="text" id="name" th:field="*{name}" required>

                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3" required></textarea>

                <label for="price">Price ($)</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required>

                <button type="submit" class="btn btn-primary">Save Service</button>
                <a th:href="@{/services}" class="btn btn-outline" th:if="${providedService.id != null}">Cancel</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
